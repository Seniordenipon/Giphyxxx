<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giphyxxx - Loops en Video</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }
    header {
      background-color: #1e1e1e;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ff4081;
    }
    .search-bar {
      margin-top: 10px;
      flex: 1;
      text-align: right;
    }
    input[type="text"] {
      padding: 8px;
      border-radius: 5px;
      border: none;
      width: 200px;
      background-color: #2c2c2c;
      color: white;
    }

    nav {
      background-color: #1e1e1e;
      padding: 10px 20px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    nav button {
      background-color: #2c2c2c;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    nav button:hover {
      background-color: #ff4081;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .video-card {
      background-color: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s;
    }

    .video-card:hover {
      transform: scale(1.02);
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    .pagination {
      display: flex;
      justify-content: center;
      padding: 20px;
      gap: 10px;
    }

    .pagination button {
      background-color: #2c2c2c;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    .pagination button:hover {
      background-color: #ff4081;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #aaa;
      background-color: #1e1e1e;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Giphyxxx</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar loops..." oninput="filtrarVideos()" />
    </div>
  </header>

  <nav>
    <button onclick="filtrarCategoria('todas')">Todas</button>
    <button onclick="filtrarCategoria('divertido')">Divertido</button>
    <button onclick="filtrarCategoria('anime')">Anime</button>
    <button onclick="filtrarCategoria('bailes')">Bailes</button>
    <button onclick="filtrarCategoria('otros')">Otros</button>
  </nav>

  <div class="gallery" id="videoGallery">
    <div class="video-card" data-categoria="divertido">
      <video autoplay muted loop>
        <source src="https://samplelib.com/lib/preview/mp4/sample-5s.mp4" type="video/mp4">
      </video>
    </div>
    <div class="video-card" data-categoria="anime">
      <video autoplay muted loop>
        <source src="https://samplelib.com/lib/preview/mp4/sample-10s.mp4" type="video/mp4">
      </video>
    </div>
    <div class="video-card" data-categoria="bailes">
      <video autoplay muted loop>
        <source src="https://samplelib.com/lib/preview/mp4/sample-15s.mp4" type="video/mp4">
      </video>
    </div>
    <div class="video-card" data-categoria="otros">
      <video autoplay muted loop>
        <source src="https://samplelib.com/lib/preview/mp4/sample-20s.mp4" type="video/mp4">
      </video>
    </div>
    <!-- Puedes duplicar estos divs con diferentes categorías -->
  </div>

  <div class="pagination">
    <button>&laquo; Anterior</button>
    <button>Siguiente &raquo;</button>
  </div>

  <footer>
    © 2025 Giphyxxx - Todos los derechos reservados
  </footer>

  <script>
    function filtrarCategoria(categoria) {
      const videos = document.querySelectorAll('.video-card');
      videos.forEach(v => {
        if (categoria === 'todas' || v.dataset.categoria === categoria) {
          v.style.display = 'block';
        } else {
          v.style.display = 'none';
        }
      });
    }

    function filtrarVideos() {
      const filtro = document.getElementById('searchInput').value.toLowerCase();
      const videos = document.querySelectorAll('.video-card');
      videos.forEach(v => {
        const cat = v.dataset.categoria.toLowerCase();
        v.style.display = cat.includes(filtro) ? 'block' : 'none';
      });
    }
  </script>

</body>
</html>
